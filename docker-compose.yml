version: "3.8"

services:
  it-academy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-academy-platform
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persist user data and database on host machine
      - ./src/data:/app/src/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
